name: kotlin-examples

on:
  pull_request:
    paths:
      - "languages/kotlin/**"
  push:
    branches: [main]
    paths:
      - "languages/kotlin/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin < /dev/null
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"
      - name: Compile and run every example and solution
        run: |
          set -e
          out=$(mktemp -d)
          find languages/kotlin \( -name "example.kt" -o -path "*/solutions/exercise_*.kt" \) \
            -not -path "*/11_modules_packages/*" -not -path "*/14_databases/*" | while read -r f; do
            echo "Running $f"
            jar="$out/$(basename "$f" .kt)-$RANDOM.jar"
            kotlinc "$f" -include-runtime -d "$jar"
            java -jar "$jar"
          done
      - name: Compile and run modules_packages (multi-file)
        run: |
          set -e
          out=$(mktemp -d)
          dir=languages/kotlin/11_modules_packages
          kotlinc "$dir/example.kt" "$dir/mypackage/Helpers.kt" -include-runtime -d "$out/example.jar"
          java -jar "$out/example.jar"
          kotlinc "$dir/solutions/exercise_1.kt" "$dir/mypackage/Helpers.kt" -include-runtime -d "$out/exercise_1.jar"
          java -jar "$out/exercise_1.jar"
      - name: Compile and run databases (JDBC + sqlite-jdbc)
        run: |
          set -e
          out=$(mktemp -d)
          jdbc="$out/sqlite-jdbc.jar"
          curl -sL -o "$jdbc" "https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.47.1.0/sqlite-jdbc-3.47.1.0.jar"
          dir=languages/kotlin/14_databases
          kotlinc "$dir/example.kt" -include-runtime -cp "$jdbc" -d "$out/example.jar"
          java -cp "$out/example.jar:$jdbc" ExampleKt
          kotlinc "$dir/solutions/exercise_1.kt" -include-runtime -cp "$jdbc" -d "$out/exercise_1.jar"
          java -cp "$out/exercise_1.jar:$jdbc" Exercise_1Kt
