name: kotlin-examples

on:
  pull_request:
    paths:
      - "languages/kotlin/**"
  push:
    branches: [main]
    paths:
      - "languages/kotlin/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin < /dev/null
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"
      - name: Compile and run every example and solution
        run: |
          set -e
          out=$(mktemp -d)
          find languages/kotlin \( -name "example.kt" -o -path "*/solutions/exercise_*.kt" \) | while read -r f; do
            echo "Running $f"
            jar="$out/$(basename "$f" .kt)-$RANDOM.jar"
            kotlinc "$f" -include-runtime -d "$jar"
            java -jar "$jar"
          done
