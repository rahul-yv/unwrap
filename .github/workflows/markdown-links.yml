name: markdown-links

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            grep -oE '\]\(\.[^)]*\)' "$file" | sed -E 's/^\]\(//; s/\)$//' | while read -r link; do
              target="$dir/$link"
              target="${target%%#*}"
              if [ ! -e "$target" ]; then
                echo "Broken link in $file -> $link"
                exit 1
              fi
            done || fail=1
          done < <(find . -name "*.md" -not -path "./node_modules/*" -print0)
          exit $fail
