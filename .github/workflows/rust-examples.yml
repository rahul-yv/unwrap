name: rust-examples

on:
  pull_request:
    paths:
      - "languages/rust/**"
  push:
    branches: [main]
    paths:
      - "languages/rust/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run every example and solution
        run: |
          set -e
          out=$(mktemp -d)
          find languages/rust \( -name "example.rs" -o -path "*/solutions/exercise_*.rs" \) \
            -not -path "*/12_testing/*" \
            -not -path "*/14_databases/*" \
            -not -path "*/16_security/*" | while read -r f; do
            echo "Running $f"
            bin="$out/$(basename "$f" .rs)-$RANDOM"
            rustc -D warnings "$f" -o "$bin"
            "$bin"
          done
      - name: Compile and run the testing topic (rustc --test)
        run: |
          set -e
          out=$(mktemp -d)
          find languages/rust/12_testing \( -name "example.rs" -o -path "*/solutions/exercise_*.rs" \) | while read -r f; do
            echo "Running $f"
            bin="$out/$(basename "$f" .rs)-$RANDOM"
            rustc --test -D warnings "$f" -o "$bin"
            "$bin"
          done
      - name: Build and run the Cargo-based topics (databases, security)
        run: |
          set -e
          for dir in languages/rust/14_databases languages/rust/16_security; do
            echo "Building $dir"
            (cd "$dir" && cargo build --release)
            "$dir/target/release/example"
            "$dir/target/release/exercise_1"
          done
