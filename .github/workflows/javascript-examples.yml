name: javascript-examples

on:
  pull_request:
    paths:
      - "languages/javascript/**"
  push:
    branches: [main]
    paths:
      - "languages/javascript/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run every example and solution
        run: |
          set -e
          find languages/javascript \( -name "example.js" -o -name "example.mjs" -o -path "*/solutions/exercise_*.js" -o -path "*/solutions/exercise_*.mjs" \) | while read -r f; do
            echo "Running $f"
            node "$f"
          done
      - name: Run node:test files
        run: |
          set -e
          find languages/javascript -name "test_*.js" | while read -r f; do
            echo "Running $f"
            node --test "$f"
          done
