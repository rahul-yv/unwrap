name: swift-examples

on:
  pull_request:
    paths:
      - "languages/swift/**"
  push:
    branches: [main]
    paths:
      - "languages/swift/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Compile and run every example and solution
        run: |
          set -e
          find languages/swift \( -name "example.swift" -o -path "*/solutions/exercise_*.swift" \) \
            -not -path "*/11_modules_packages/*" -not -path "*/16_security/*" | while read -r f; do
            echo "Running $f"
            swift "$f"
          done
      - name: Compile and run modules_packages (multi-file)
        run: |
          set -e
          out=$(mktemp -d)
          dir=languages/swift/11_modules_packages
          swiftc "$dir/main.swift" "$dir/mypackage/Helpers.swift" -o "$out/example"
          "$out/example"
          swiftc "$dir/solutions/main.swift" "$dir/mypackage/Helpers.swift" -o "$out/exercise_1"
          "$out/exercise_1"
      - name: Compile and run security (swift-crypto package)
        run: |
          set -e
          cd languages/swift/16_security
          swift run example
          swift run exercise_1
