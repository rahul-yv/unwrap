name: c-examples

on:
  pull_request:
    paths:
      - "languages/c/**"
  push:
    branches: [main]
    paths:
      - "languages/c/**"

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run every example and solution
        run: |
          set -e
          out=$(mktemp -d)
          find languages/c \( -name "example.c" -o -path "*/solutions/exercise_*.c" \) | while read -r f; do
            echo "Running $f"
            bin="$out/$(basename "$f" .c)-$RANDOM"
            gcc -std=c17 -Wall -Wextra -Werror "$f" -o "$bin" -lm
            "$bin"
          done
